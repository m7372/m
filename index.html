      </div>

  <script>
    const API = 'https://mo.m737217130.workers.dev/';
    let currentPage = 1;
    let currentCategory = '';
    let currentSearch = '';
    let hls = null;
    let hideControlsTimer;

    // حالة القائمة (تراكمية: المزيد يضيف ولا يمسح)
    const shownKeys = new Set();
    const seenPostIds = new Set();
    const seriesMap = new Map();   // series_slug -> المسلسل (يحتفظ بحلقاته)
    let hasMore = true;
    let loadingMore = false;
    let listToken = 0;

    // حالة نافذة المسلسل
    let activeSeries = null;
    let activeSeasonName = null;

    // طابور حساب عدد الحلقات في الخلفية
    const pending = [];
    let workers = 0;
    const MAX_WORKERS = 2;

    const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

    // ===== Splash =====
    const splash = document.getElementById('splash-screen');
    const mainApp = document.getElementById('main-app');

    function enterSite() {
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.display = 'none';
        mainApp.style.display = 'block';
        fetchCategories();
        loadMore(true);
        try { if (new URLSearchParams(location.search).get('fav') === '1') document.getElementById('favCatBtn').click(); } catch (e) {}
        setTimeout(() => { const first = document.querySelector('.cat-btn'); if (first) first.focus(); }, 100);
      }, 600);
    }
    splash.addEventListener('click', enterSite);
    document.addEventListener('keydown', (e) => {
      if (splash.style.display !== 'none' && (e.key === 'Enter' || e.key === ' ')) enterSite();
    });

    // ===== Helpers =====
    function normAr(s) {
      return String(s || '')
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
        .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
    }

    function seasonOrder(name) {
      const n = normAr(name);
      const m = n.match(/\d+/);
      if (m) return parseInt(m[0], 10);
      const words = ['اول', 'ثاني', 'ثالث', 'رابع', 'خامس', 'سادس', 'سابع', 'ثامن', 'تاسع', 'عاشر'];
      for (let i = 0; i < words.length; i++) if (n.includes(words[i])) return i + 1;
      return 999;
    }

    function episodeNumber(ep) {
      let m = normAr(ep.meta?.number).match(/\d+/);
      if (!m) m = normAr(ep.title).match(/الحلقه\s*(\d+)/);
      return m ? parseInt(m[1] || m[0], 10) : 9999;
    }

    function seasonNameOf(ep) {
      return ep.season_info?.name || ep.movie_season || 'الموسم الأول';
    }

    function addEpisodes(series, eps) {
      eps.forEach(ep => {
        if (!series.episodes.some(e => e.realid === ep.realid)) series.episodes.push(ep);
      });
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      return res.json();
    }

    function cleanQuery(s) {
      return String(s || '')
        .replace(/الحلقة\s*[\d٠-٩]*/g, ' ')
        .replace(/(الموسم|موسم)\s*\S*/g, ' ')
        .replace(/season\s*\d*/gi, ' ')
        .replace(/episode\s*\d*/gi, ' ')
        .replace(/مترجم[ةه]?|مدبلج[ةه]?/g, ' ')
        .replace(/\s+/g, ' ').trim();
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    async function fetchRetry(url, tries = 3) {
      for (let i = 0; i < tries; i++) {
        try { return await fetchJSON(url); }
        catch (e) { if (i < tries - 1) await sleep(350 * (i + 1)); }
      }
      return null;
    }
    const searchUrl = (q, page) => `${API}?action=search&search=${encodeURIComponent(q)}&page=${page}`;

    function seriesBase(series) {
      return cleanQuery(series.infoName) || cleanQuery(series.title) || series.title;
    }

    function buildQueries(series, deep) {
      const e0 = series.episodes[0];
      const raw = [
        series.title.replace('الحلقة', '').trim(),
        cleanQuery(series.title),
        series.infoName,
        cleanQuery(series.infoName),
        cleanQuery(e0?.series_info?.name),
        cleanQuery(e0?.title)
      ];
      const uniq = [...new Set(raw.map(q => (q || '').trim()).filter(q => q.length > 1))];
      return uniq.slice(0, deep ? 6 : 4);
    }

    // ===== Badge (عدد الحلقات) =====
    function badgeText(series) {
      const n = Math.max(series.episodes.length, series.cached || 0);
      return n ? `${n} حلقة` : '…';
    }
    function updateBadge(series) { if (series.badgeEl) series.badgeEl.textContent = badgeText(series); }

    let seriesRenderQueued = false;
    function progress(series) {
      updateBadge(series);
      if (series === activeSeries && !seriesRenderQueued) {
        seriesRenderQueued = true;
        requestAnimationFrame(() => {
          seriesRenderQueued = false;
          if (activeSeries) { renderSeries(); updateLoadStatus(); }
        });
      }
      if (series === playerSeries && panelOpen) renderEpPanel();
    }

    // ===== مسح صفحات البحث لاستخراج كل حلقات المسلسل =====
    async function scanQuery(series, q, deep) {
      const maxPages = deep ? 80 : 50;
      const seenQ = new Set();
      let stalls = 0, noMatch = 0, fails = 0;
      for (let page = 1; page <= maxPages; page++) {
        const data = await fetchRetry(searchUrl(q, page));
        if (!data) { if (++fails >= 2) break; continue; }
        const posts = data.posts || [];
        if (!posts.length) break;

        const fresh = posts.filter(p => !seenQ.has(p.realid));
        if (!fresh.length) { if (++stalls >= 3) break; continue; }
        stalls = 0;
        fresh.forEach(p => seenQ.add(p.realid));

        const mine = fresh.filter(p => p.series_slug === series.series_slug);
        if (mine.length) {
          noMatch = 0;
          addEpisodes(series, mine);
          progress(series);
        } else if (++noMatch >= (deep ? 8 : 5)) break;
      }
    }

    function startLoad(series, deep = false) {
      if (series.loadPromise && !deep) return series.loadPromise;
      if (!series.completing) series.loading = true;
      const p = (async () => {
        try { for (const q of buildQueries(series, deep)) await scanQuery(series, q, deep); }
        catch (e) { console.error(e); }
        if (!series.completing) series.loading = false;
        series.countReady = true;
        if (series.episodes.length) saveCount(series.series_slug, series.episodes.length);
        progress(series);
      })();
      series.loadPromise = p;
      return p;
    }

    // ===== كشف الحلقات الناقصة (ثغرات في الترقيم) وجلبها =====
    function hasEp(series, season, n) {
      return series.episodes.some(e => seasonNameOf(e) === season && episodeNumber(e) === n);
    }

    function gapsOf(series, probeNext) {
      const seasons = groupSeasons(series);
      const names = Object.keys(seasons).sort((a, b) => seasonOrder(a) - seasonOrder(b) || a.localeCompare(b, 'ar'));
      const out = [];
      names.forEach((name, idx) => {
        const nums = seasons[name].map(episodeNumber).filter(n => n < 9999);
        if (!nums.length) return;
        const min = Math.min(...nums), max = Math.max(...nums);
        const set = new Set(nums);
        // المواسم اللاحقة التي تكمل الترقيم من حيث توقف الموسم السابق لا تُحسب ناقصة
        const lo = (idx > 0 && min > 1) ? min : 1;
        for (let n = lo; n <= max && n <= 600; n++) if (!set.has(n)) out.push({ season: name, n });
        if (probeNext) for (let k = 1; k <= 2; k++) out.push({ season: name, n: max + k, probe: true });
      });
      return out;
    }

    async function findEpisode(series, season, n, multi) {
      const base = seriesBase(series);
      const qs = multi ? [`${base} ${season} الحلقة ${n}`, `${base} الحلقة ${n}`] : [`${base} الحلقة ${n}`, `${base} ${n}`];
      for (const q of qs) {
        const data = await fetchRetry(searchUrl(q, 1), 2);
        const mine = (data?.posts || []).filter(p => p.series_slug === series.series_slug);
        if (mine.length) { addEpisodes(series, mine); progress(series); }
        if (hasEp(series, season, n)) return true;
      }
      return false;
    }

    async function fillGaps(series, deep) {
      const multi = Object.keys(groupSeasons(series)).length > 1;
      const queue = gapsOf(series, deep).slice(0, deep ? 160 : 70);
      const worker = async () => {
        while (queue.length) {
          const g = queue.shift();
          if (hasEp(series, g.season, g.n)) continue;
          await findEpisode(series, g.season, g.n, multi);
        }
      };
      await Promise.all([worker(), worker(), worker()]);
    }

    // مسح كامل (ثم الثغرات) — يُستدعى عند فتح المسلسل، أو بالقوة من زر «جلب الحلقات»
    async function completeSeries(series, deep = false) {
      if (series.completing) return;
      if (!deep && series.gapsDone && series.loadPromise) return;
      series.completing = true;
      series.loading = true;
      series.phase = 'scan';
      progress(series);
      try {
        await startLoad(series, deep);
        series.phase = 'gaps';
        progress(series);
        await fillGaps(series, deep);
        series.gapsDone = true;
      } catch (e) { console.error(e); }
      series.completing = false;
      series.loading = false;
      series.phase = '';
      series.countReady = true;
      if (series.episodes.length) { saveCount(series.series_slug, series.episodes.length); saveEpisodes(series); }
      progress(series);
    }

    function queueCounts(items) {
      items.forEach(i => { if (i.isSeries && !i.loadPromise) pending.push(i); });
      pump();
    }

    function pump() {
      while (workers < MAX_WORKERS && pending.length) {
        const it = pending.shift();
        if (it.loadPromise) continue;
        workers++;
        startLoad(it).finally(() => { workers--; pump(); });
      }
    }

    // ===== Categories =====
    async function fetchCategories() {

    // ===== Utils =====
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ===== Brand letters (إضاءة متحركة على الأحرف) =====
    document.querySelectorAll('.brand').forEach(el => {
      const t = el.textContent.trim();

    // <search-core>
    // ===== محرك البحث: عربي/إنجليزي، جزء كلمة، الأقرب فالأقرب =====
    const AR = /[\u0600-\u06FF]/;
    function normText(s) {
      return String(s || '').toLowerCase()
        .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
        .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
        .replace(/[^a-z0-9\u0600-\u06FF\s]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    // هيكل صوتي موحّد: dexter = ديكستر = دكستر = "dkstr"
    const A2K = { 'ب': 'b', 'ت': 't', 'ث': 't', 'ج': 'k', 'ح': 'h', 'خ': 'k', 'د': 'd', 'ذ': 't', 'ر': 'r', 'ز': 's', 'س': 's', 'ش': 's', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 's', 'غ': 'k', 'ف': 'f', 'ق': 'k', 'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ه': 'h', 'پ': 'b', 'چ': 's', 'ڤ': 'f', 'گ': 'k' };
    function skelWord(w) {
      let o = '';
      if (AR.test(w)) {
        if (w.length > 3 && w.startsWith('ال')) w = w.slice(2);
        for (let i = 0; i < w.length; i++) {
          const m = A2K[w[i]];
          if (!m || (m === 'h' && i > 0)) continue;
          o += m;
        }
      } else {
        w = w.replace(/ph/g, 'f').replace(/sh|ch/g, 's').replace(/th/g, 't').replace(/kh/g, 'k').replace(/ck/g, 'k')
          .replace(/qu/g, 'k').replace(/gh/g, '').replace(/x/g, 'ks').replace(/c(?=[eiy])/g, 's')
          .replace(/[cgjq]/g, 'k').replace(/v/g, 'f').replace(/p/g, 'b').replace(/z/g, 's');
        for (const c of w) {
          if (!'bdfhklmnrst'.includes(c) || (c === 'h' && o)) continue;
          o += c;
        }
      }
      return o.replace(/(.)\1+/g, '$1');
    }
    const skel = s => normText(s).split(' ').filter(Boolean).map(skelWord).filter(Boolean).join(' ');

    function lev1(a, b) {
      if (Math.abs(a.length - b.length) > 1) return false;
      let i = 0, j = 0, e = 0;
      while (i < a.length && j < b.length) {
        if (a[i] === b[j]) { i++; j++; continue; }
        if (++e > 1) return false;
        if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
      }
      return e + (a.length - i) + (b.length - j) <= 1;
    }

    // درجة التطابق: كلما زادت كان الاسم أقرب
    function scoreOf(o, qn, qp) {
      if (!o._n) { o._n = normText(o.t ?? o.title); o._p = skel(o._n); }
      const t = o._n, p = o._p;
      let sc = 0;
      if (t === qn) sc = 1000;
      else if (t.startsWith(qn)) sc = 900;
      else if (t.includes(' ' + qn)) sc = 850;
      else if (t.includes(qn)) sc = 700;
      if (qp.length > 1 && p) {
        let ps = 0;
        if (p === qp) ps = 880;
        else if (p.startsWith(qp)) ps = 800;
        else if (p.includes(' ' + qp)) ps = 760;
        else if (p.includes(qp)) ps = 620;
        else if (qp.length >= 4 && !qp.includes(' ') && p.split(' ').some(w => lev1(w.slice(0, qp.length), qp) || lev1(w.slice(0, qp.length + 1), qp))) ps = 420;
        if (ps > sc) sc = ps;
      }
      return sc ? sc - Math.min(t.length, 150) * 0.3 : 0;
    }

    // أسماء مشهورة تساعد في تحويل العربي إلى الاسم الإنجليزي عند البحث في السيرفر
    const SEEDS = ('Dexter|Breaking Bad|Better Call Saul|Game of Thrones|House of the Dragon|Prison Break|Money Heist|Peaky Blinders|Vikings|The Walking Dead|Stranger Things|Friends|The Big Bang Theory|How I Met Your Mother|The Boys|Lucifer|Supernatural|Arrow|The Flash|Gotham|Smallville|The Witcher|Narcos|Ozark|The Last of Us|Squid Game|Wednesday|Sherlock|Westworld|Mr Robot|Black Mirror|Riverdale|Teen Wolf|The Vampire Diaries|Gossip Girl|Suits|Lost|Homeland|Fargo|True Detective|Shameless|Chernobyl|Mindhunter|Dark|Elite|Sex Education|Euphoria|The Crown|Bridgerton|Succession|The Mandalorian|Loki|WandaVision|Daredevil|The Punisher|Titans|Peacemaker|Reacher|Yellowstone|Ted Lasso|The Office|Brooklyn Nine-Nine|Modern Family|Greys Anatomy|The Good Doctor|Chicago Fire|NCIS|Criminal Minds|Bones|The Blacklist|Spartacus|Merlin|Outlander|Lupin|The Umbrella Academy|Cobra Kai|Arcane|Invincible|Rick and Morty|The Simpsons|Family Guy|South Park|Attack on Titan|Naruto|One Piece|Death Note|Kurulus Osman|Ertugrul|Avengers|Spider-Man|Batman|Superman|Joker|Deadpool|Iron Man|Thor|Captain America|Black Panther|Doctor Strange|Guardians of the Galaxy|Fast and Furious|John Wick|Mission Impossible|Transformers|Harry Potter|Lord of the Rings|The Hobbit|Pirates of the Caribbean|Jurassic Park|Jurassic World|Avatar|Titanic|Interstellar|Inception|Terminator|The Matrix|Gladiator|Rambo|Rocky|Die Hard|Home Alone|Frozen|Toy Story|Shrek|Minions|Kung Fu Panda|Ice Age|Aladdin|The Lion King|Moana|Encanto|Coco|Venom|Aquaman|Wonder Woman|Justice League|Black Adam|Top Gun|Oppenheimer|Barbie|Dune|Tenet|Dunkirk|Taken|Saw|The Conjuring|Annabelle|Insidious|Scream|Halloween|Final Destination|Resident Evil|Mortal Kombat|Hunger Games|Divergent|Twilight|Maze Runner|Knives Out|Extraction|Red Notice|Bullet Train|Creed|Sicario|Prisoners|Fight Club|Forrest Gump|The Godfather|Scarface').split('|');
    let SEED_SK = null;
    function seedLookup(q) {
      const qp = skel(q);
      if (qp.length < 2) return [];
      if (!SEED_SK) SEED_SK = SEEDS.map(n => ({ n, p: skel(n) }));
      return SEED_SK.filter(x => x.p.startsWith(qp) || x.p.includes(' ' + qp)).sort((a, b) => a.p.length - b.p.length).slice(0, 1).map(x => x.n);
    }

    // توليد كتابات بديلة للبحث في السيرفر (عربي <-> إنجليزي)
    const AR2LAT = { 'ب': 'b', 'ت': 't', 'ث': 'th', 'ج': 'j', 'ح': 'h', 'خ': 'kh', 'د': 'd', 'ذ': 'th', 'ر': 'r', 'ز': 'z', 'س': 's', 'ش': 'sh', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': 'a', 'غ': 'g', 'ف': 'f', 'ق': 'k', 'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ه': 'h' };
    function arWordToLat(w, ve) {
      let s = '';
      for (let i = 0; i < w.length; i++) {
        const c = w[i], n = w[i + 1];
        if (c === 'ك' && n === 'س') { s += 'x'; i++; }
        else if (c === 'ي') s += i === 0 ? 'y' : ve;
        else if (c === 'و') s += i === 0 ? 'w' : 'o';
        else if ('اءئؤ'.includes(c)) s += 'a';
        else s += AR2LAT[c] ?? '';
      }
      if (!/[aeiou]/.test(s)) s = s.replace(/^([^aeiou])([^aeiou])/, '$1e$2');
      return s.replace(/([^aeiou])r$/, '$1er');
    }
    const LAT2AR = { a: 'ا', b: 'ب', c: 'ك', d: 'د', f: 'ف', g: 'ج', h: 'ه', j: 'ج', k: 'ك', l: 'ل', m: 'م', n: 'ن', p: 'ب', q: 'ق', r: 'ر', s: 'س', t: 'ت', v: 'ف', w: 'و', y: 'ي', z: 'ز' };
    function latWordToAr(w, longV) {
      w = w.replace(/e$/, '').replace(/er$/, 'r')
        .replace(/ph/g, 'f').replace(/sh/g, '$').replace(/ch/g, '#').replace(/th/g, '^').replace(/kh/g, '&').replace(/ck/g, 'k').replace(/x/g, '@');
      let o = '', seenV = false;
      for (let i = 0; i < w.length; i++) {
        const c = w[i];
        if (c === '$') o += 'ش'; else if (c === '#') o += 'تش'; else if (c === '^') o += 'ث'; else if (c === '&') o += 'خ'; else if (c === '@') o += 'كس';
        else if ('aeiou'.includes(c)) {
          if (i === 0) o += 'ا';
          else if (longV && !seenV) o += (c === 'o' || c === 'u') ? 'و' : (c === 'a' ? 'ا' : 'ي');
          seenV = true;
        } else o += LAT2AR[c] ?? '';
      }
      return o;
    }
    function buildVariants(q) {
      const out = [q.trim()];
      const words = normText(q).split(' ').filter(Boolean);
      const ar = AR.test(q), lat = /[a-z]/i.test(q);
      const add = v => { v = (v || '').trim(); if (v.length > 1 && !out.some(o => o.toLowerCase() === v.toLowerCase())) out.push(v); };
      if (ar && !lat) {
        seedLookup(q).forEach(add);
        add(words.map(w => arWordToLat(w, 'e')).join(' '));
        add(words.map(w => arWordToLat(w, 'i')).join(' '));
      } else if (lat && !ar) {
        add(words.map(w => latWordToAr(w, true)).join(' '));
        add(words.map(w => latWordToAr(w, false)).join(' '));
      }
      return out.slice(0, 3);
    }
    // </search-core>

    // ===== الفهرس المحلي (يتعلم من كل ما يظهر في الموقع) + كاش أعداد الحلقات =====
    const IDX_KEY = 'alm_idx_v1', CNT_KEY = 'alm_cnt_v1';
    const idx = new Map();
    const movieMap = new Map();
    let idxT, cntT, cnt = {};
    try { cnt = JSON.parse(localStorage.getItem(CNT_KEY) || '{}'); } catch (e) { cnt = {}; }

    // كاش الحلقات (يتراكم ولا يُمسح، فتظهر الحلقات فوراً عند إعادة الفتح)
    const EPS_KEY = 'alm_eps_v1';
    let epsCache = {}, epsT;
    try { epsCache = JSON.parse(localStorage.getItem(EPS_KEY) || '{}'); } catch (e) { epsCache = {}; }
    function saveEpisodes(series) {
      epsCache[series.series_slug] = { t: Date.now(), e: series.episodes.map(e => [e.realid, e.title, e.meta?.number ?? '', seasonNameOf(e)]) };
      clearTimeout(epsT);
      epsT = setTimeout(() => {
        const ks = Object.keys(epsCache);
        if (ks.length > 120) ks.sort((a, b) => epsCache[a].t - epsCache[b].t).slice(0, ks.length - 120).forEach(k => delete epsCache[k]);
        try { localStorage.setItem(EPS_KEY, JSON.stringify(epsCache)); } catch (e) {}
      }, 1200);
    }

    // المفضلة
    const FAV_KEY = 'alm_fav_v1';
    const favs = new Map();
    let favMode = false;
    try { JSON.parse(localStorage.getItem(FAV_KEY) || '[]').forEach(e => { if (e && e.k) favs.set(e.k, e); }); } catch (e) {}
    const isFav = it => !!it && favs.has(it.key);
    function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs.values()])); } catch (e) {} }
    function updateFavCount() { const el = document.getElementById('favCount'); if (el) el.textContent = favs.size ? ` (${favs.size})` : ''; }

    function loadIndex() {
      try { JSON.parse(localStorage.getItem(IDX_KEY) || '[]').forEach(e => { if (e && e.k && e.t && !idx.has(e.k)) idx.set(e.k, e); }); } catch (e) {}
    }
    window.requestIdleCallback ? requestIdleCallback(loadIndex, { timeout: 1500 }) : setTimeout(loadIndex, 300);

    function indexItem(item) {
      if (idx.has(item.key)) return;
      idx.set(item.key, item.isSeries
        ? { k: item.key, t: item.title, th: item.thumbnail, s: item.series_slug, i: item.infoName }
        : { k: item.key, t: item.title, th: item.thumbnail, r: item.realid });
      if (idx.size > 2500) idx.delete(idx.keys().next().value);
      clearTimeout(idxT);
      idxT = setTimeout(() => {
        try { localStorage.setItem(IDX_KEY, JSON.stringify([...idx.values()].map(e => ({ k: e.k, t: e.t, th: e.th, s: e.s, r: e.r, i: e.i })))); } catch (e) {}
      }, 4000);
    }

    function cachedCount(slug) {
      const c = cnt[slug];
      return c && Date.now() - c.t < 12 * 3600e3 ? c.n : 0;
    }
    function saveCount(slug, n) {
      cnt[slug] = { n, t: Date.now() };
      clearTimeout(cntT);
      cntT = setTimeout(() => {
        const ks = Object.keys(cnt);
        if (ks.length > 800) ks.sort((a, b) => cnt[a].t - cnt[b].t).slice(0, ks.length - 800).forEach(k => delete cnt[k]);
        try { localStorage.setItem(CNT_KEY, JSON.stringify(cnt)); } catch (e) {}
      }, 1500);
    }

    // ===== تحويل المنشورات إلى عناصر =====
    function newSeries(d) {
      const s = {
        isSeries: true, key: 's' + d.series_slug, series_slug: d.series_slug, title: d.title, infoName: d.infoName || '',
        thumbnail: d.thumbnail, story: d.story || '', episodes: [], countReady: false, loading: false, loadPromise: null,
        badgeEl: null, cached: cachedCount(d.series_slug), completing: false, gapsDone: false, phase: ''
      };
      const c = epsCache[d.series_slug];
      if (c && c.e) addEpisodes(s, c.e.map(a => ({ realid: a[0], title: a[1], meta: { number: a[2] }, season_info: { name: a[3] }, movie_season: a[3], series_slug: d.series_slug })));
      s.cached = Math.max(s.cached || 0, s.episodes.length);
      seriesMap.set(d.series_slug, s);
      return s;
    }
    function newMovie(key, d) {
      const m = { isSeries: false, key, title: d.title, thumbnail: d.thumbnail, realid: d.realid, story: d.story || '' };
      movieMap.set(key, m);
      return m;
    }
    function itemFromPost(post) {
      if (post.series_slug) {
        const s = seriesMap.get(post.series_slug) || newSeries({
          series_slug: post.series_slug, title: post.series_info?.name || post.movie_season || post.title,
          infoName: post.series_info?.name || '', thumbnail: post.thumbnail, story: post.meta?.story || ''
        });
        addEpisodes(s, [post]);
        return s;
      }
      const key = 'm' + (post.realid ?? post.slug ?? post.title);
      return movieMap.get(key) || newMovie(key, { title: post.title, thumbnail: post.thumbnail, realid: post.realid, story: post.meta?.story || '' });
    }
    function itemFromEntry(e) {
      if (e.s) return seriesMap.get(e.s) || newSeries({ series_slug: e.s, title: e.t, infoName: e.i, thumbnail: e.th, story: e.st });
      return movieMap.get(e.k) || newMovie(e.k, { title: e.t, thumbnail: e.th, realid: e.r, story: e.st });
    }

    // ===== عرض البوسترات =====
    let rendered = [];
    const countObserver = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
      es.forEach(en => {
        if (!en.isIntersecting) return;
        countObserver.unobserve(en.target);
        const it = en.target._item;
        if (it && it.isSeries && !it.loadPromise && !it.cached) pending.push(it);
      });
      pump();
    }, { rootMargin: '300px' }) : null;

    function clearGrid() {
      rendered = [];
      if (countObserver) countObserver.disconnect();
      document.getElementById('movieGrid').innerHTML = '';
    }

    function renderCards(items) {
      const frag = document.createDocumentFragment();
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;
        const open = item.isSeries ? () => openSeriesModal(item) : () => playMovie(item.realid, item.title, null, item);
        card.onclick = open;
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
        card.innerHTML = `<div class="poster-wrap"><img src="${esc(item.thumbnail)}" alt="${esc(item.title)}" loading="lazy" decoding="async" /></div><h3>${esc(item.title)}</h3>`;
        if (item.isSeries) {
          const badge = document.createElement('span');
          badge.className = 'ep-badge';
          badge.textContent = badgeText(item);
          item.badgeEl = badge;
          card._item = item;
          card.querySelector('.poster-wrap').appendChild(badge);
          if (countObserver) countObserver.observe(card); else pending.push(item);
        }
        const fb = document.createElement('button');
        fb.className = 'fav-btn' + (isFav(item) ? ' on' : '');
        fb.dataset.key = item.key;
        fb.tabIndex = -1;
        fb.setAttribute('aria-label', 'المفضلة');
        fb.innerHTML = ICON.heart;
        fb.onclick = (ev) => { ev.stopPropagation(); fb.blur(); toggleFav(item); };
        card.querySelector('.poster-wrap').appendChild(fb);
        frag.appendChild(card);
        rendered.push(item.key);
      });
      document.getElementById('movieGrid').appendChild(frag);
      if (!countObserver) pump();
    }

    // يضيف الجديد فقط إذا بقي الترتيب كما هو، وإلا يعيد البناء
    function syncGrid(items) {
      let same = rendered.length <= items.length;
      for (let i = 0; i < rendered.length && same; i++) if (rendered[i] !== items[i].key) same = false;
      if (!same || !rendered.length) clearGrid();
      const add = items.slice(rendered.length);
      if (add.length) renderCards(add);
    }

    function updateMoreBtn() {
      const show = searchMode ? (sq.pool.size > 0 && (sq.pool.size > sq.limit || sq.hasMore)) : (hasMore && shownKeys.size > 0);
      const busy = searchMode ? sq.busy : loadingMore;
      document.getElementById('moreWrap').style.display = show ? 'flex' : 'none';
      document.getElementById('moreBtn').disabled = busy;
      document.getElementById('moreLabel').textContent = busy ? 'جاري التحميل...' : 'المزيد';
    }

    // ===== القائمة العادية (الرئيسية / التصنيفات) =====
    function pageUrl(page) {
      return currentCategory ? `${API}?action=posts&category=${currentCategory}&page=${page}` : `${API}?action=posts&page=${page}`;
    }

    function addPosts(posts) {
      const newItems = [];
      let unseen = 0;
      posts.forEach(post => {
        const pid = post.realid ?? post.slug ?? post.title;
        if (seenPostIds.has(pid)) return;
        seenPostIds.add(pid);
        unseen++;
        const item = itemFromPost(post);
        indexItem(item);
        if (!shownKeys.has(item.key)) { shownKeys.add(item.key); newItems.push(item); }
      });
      return { newItems, unseen };
    }

    async function loadMore(reset = false) {
      if (favMode && !searchMode) { if (reset) showFavs(); return; }
      if (searchMode && !reset) return searchMore();
      if (loadingMore && !reset) return;
      const token = reset ? ++listToken : listToken;
      const grid = document.getElementById('movieGrid');

      if (reset) {
        currentPage = 1;
        hasMore = true;
        pending.length = 0;
        shownKeys.clear();
        seenPostIds.clear();
        clearGrid();
        grid.innerHTML = '<p class="muted">جاري التحميل...</p>';
      }
      loadingMore = true;
      updateMoreBtn();

      const target = isMobile() ? 9 : 14;
      let added = 0, fetches = 0, stalls = 0, failed = false;
      let firstRender = reset;

      try {
        while (added < target && hasMore && fetches < 8) {
          const data = await fetchJSON(pageUrl(currentPage));
          if (token !== listToken) return;
          fetches++;

          const posts = data?.posts || [];
          if (!posts.length) { hasMore = false; break; }
          currentPage++;

          const { newItems, unseen } = addPosts(posts);
          if (unseen === 0) { if (++stalls >= 2) { hasMore = false; break; } continue; }
          stalls = 0;

          if (firstRender) { grid.innerHTML = ''; firstRender = false; }
          renderCards(newItems);
          added += newItems.length;
        }
      } catch (e) { console.error(e); failed = true; }

      if (token !== listToken) return;
      loadingMore = false;
      if (shownKeys.size === 0) {
        grid.innerHTML = failed ? '<p class="muted">حدث خطأ أثناء تحميل البيانات.</p>' : '<p class="muted">لا توجد نتائج لعرضها.</p>';
      }
      updateMoreBtn();
    }

    // ===== البحث اللحظي =====
    let searchMode = false, searchDebounce, syncRaf = 0;
    const sq = { id: 0, ctrl: null, timer: 0, q: '', qn: '', qp: '', variants: [], page: 1, hasMore: false, busy: false, waiting: false, limit: 18, pool: new Map(), pendingReqs: 0 };
    const sCache = new Map();
    const sInput = document.getElementById('searchInput');
    const STEP = () => isMobile() ? 18 : 24;

    async function getSearch(v, page, signal) {
      const k = v + '|' + page;
      if (sCache.has(k)) return sCache.get(k);
      const r = await fetch(`${API}?action=search&search=${encodeURIComponent(v)}&page=${page}`, { signal });
      const d = await r.json();
      sCache.set(k, d);
      if (sCache.size > 80) sCache.delete(sCache.keys().next().value);
      return d;
    }

    function poolAdd(item, sc) {
      const cur = sq.pool.get(item.key);
      if (!cur || sc > cur.sc) sq.pool.set(item.key, { item, sc });
    }
    const sortedPool = () => [...sq.pool.values()].sort((a, b) => b.sc - a.sc || a.item.title.length - b.item.title.length);

    function scheduleSync() {
      if (syncRaf) return;
      syncRaf = requestAnimationFrame(() => { syncRaf = 0; renderSearch(); });
    }

    function renderSearch() {
      if (!searchMode) return;
      const all = sortedPool();
      syncGrid(all.slice(0, sq.limit).map(x => x.item));
      if (!all.length) {
        document.getElementById('movieGrid').innerHTML = `<p class="muted">${(sq.pendingReqs > 0 || sq.waiting) ? 'جاري البحث...' : 'لا توجد نتائج لعرضها.'}</p>`;
      }
      updateMoreBtn();
    }

    async function fetchSearchPage(id, page) {
      const vs = sq.variants;
      let any = false;
      sq.waiting = false;
      sq.pendingReqs += vs.length;
      await Promise.all(vs.map(async (v, vi) => {
        try {
          const data = await getSearch(v, page, sq.ctrl.signal);
          if (id !== sq.id) return;
          const posts = data?.posts || [];
          if (posts.length) any = true;
          posts.forEach((p, pi) => {
            const item = itemFromPost(p);
            indexItem(item);
            poolAdd(item, scoreOf(item, sq.qn, sq.qp) || (100 - Math.min(vi * 10 + pi, 90)));
          });
        } catch (e) { /* إلغاء أو خطأ شبكة */ }
        finally { if (id === sq.id) { sq.pendingReqs--; scheduleSync(); } }
      }));
      if (id === sq.id && page === sq.page) sq.hasMore = any;
    }

    function runSearch(q, delay = 160) {
      if (favMode) {
        favMode = false; currentCategory = '';
        document.querySelectorAll('.cat-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
      }
      const id = ++sq.id;
      if (sq.ctrl) sq.ctrl.abort();
      clearTimeout(sq.timer);
      sq.ctrl = new AbortController();
      Object.assign(sq, { q, qn: normText(q), qp: skel(q), page: 1, hasMore: false, busy: false, waiting: false, limit: STEP(), pool: new Map(), pendingReqs: 0 });
      searchMode = true;
      loadingMore = false;
      listToken++;
      pending.length = 0;

      // 1) نتائج فورية من الفهرس المحلي
      const hits = [];
      idx.forEach(e => { const sc = scoreOf(e, sq.qn, sq.qp); if (sc) hits.push([sc, e]); });
      hits.sort((a, b) => b[0] - a[0]).slice(0, 80).forEach(([sc, e]) => poolAdd(itemFromEntry(e), sc));

      // 2) السيرفر بعد توقف قصير عن الكتابة
      if (sq.qn.length >= 2) {
        sq.variants = buildVariants(q);
        sq.waiting = true;
        sq.timer = setTimeout(() => fetchSearchPage(id, 1), delay);
      }
      renderSearch();
    }

    function cycleAspect() {

    function levelLabel(i) { const l = hls.levels[i]; return l.height ? String(l.height) : Math.round(l.bitrate / 1000) + 'k'; }
    function buildQualities() {
      if (!hls || !hls.levels || hls.levels.length < 2) return;
      const best = new Map();
      hls.levels.forEach((l, i) => {
        const h = l.height || l.bitrate;
        const prev = best.get(h);
        if (prev === undefined || hls.levels[prev].bitrate < l.bitrate) best.set(h, i);
      });
      qList = [-1, ...[...best.entries()].sort((a, b) => b[0] - a[0]).map(e => e[1])];
      qPos = 0;
      if (qList.length > 2) { $('plQuality').style.display = 'flex'; $('plQBadge').textContent = 'A'; }
    }
    function cycleQuality() {
      if (!hls || qList.length < 3) return;
      qPos = (qPos + 1) % qList.length;
      hls.currentLevel = qList[qPos];
      const auto = qList[qPos] === -1;
      $('plQBadge').textContent = auto ? 'A' : levelLabel(qList[qPos]);

    // ----- Fullscreen + دوران الشاشة + تجاوز حدود الكاميرا -----
    async function toggleFs() {
      if (isFs()) {
        try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
        try { screen.orientation.unlock(); } catch (e) {}
        return;
      }
      try {
        if (stage.requestFullscreen) await stage.requestFullscreen({ navigationUI: 'hide' });
        else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); return; }
      } catch (e) {}
      try { await screen.orientation.lock('landscape'); } catch (e) {}
    }

    // ----- Gestures: يمين = صوت، يسار = إضاءة، نقرتان = ملء الشاشة -----
    const gz = $('plGesture');
    let g = null, lastTap = 0, lastX = 0, lastY = 0, tapTimer = 0;
    gz.addEventListener('pointerdown', e => {
      gz.setPointerCapture(e.pointerId);
      const r = stage.getBoundingClientRect();
      g = { id: e.pointerId, x: e.clientX, y: e.clientY, mode: null, moved: false, h: r.height,
            side: (e.clientX - r.left) < r.width / 2 ? 'left' : 'right' };
    });
    gz.addEventListener('pointermove', e => {
      if (!g || e.pointerId !== g.id) return;
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (Math.hypot(dx, dy) > 12) g.moved = true;
      if (!g.mode) {
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) {
          g.mode = g.side === 'left' ? 'bright' : 'vol';
          g.start = g.mode === 'vol' ? (video.muted ? 0 : video.volume) : brightness;
        } else return;
      }
      const delta = -dy / (g.h * 0.7);
      if (g.mode === 'vol') setVolume(g.start + delta);
      else setBrightness(g.start + delta * 1.4);
    });
    const gEnd = e => {
      if (!g || e.pointerId !== g.id) return;
      const was = g; g = null;
      if (was.moved || e.type === 'pointercancel') return;
      const now = performance.now();
      if (now - lastTap < 300 && Math.hypot(e.clientX - lastX, e.clientY - lastY) < 40) {
        clearTimeout(tapTimer); lastTap = 0; toggleFs(); return;
      }
      lastTap = now; lastX = e.clientX; lastY = e.clientY;
      tapTimer = setTimeout(() => {
        if (panelOpen) closePanel();
        else if (uiOn) hideUI(); else showUI();
      }, 260);
    };
    gz.addEventListener('pointerup', gEnd);
    gz.addEventListener('pointercancel', gEnd);
    stage.addEventListener('pointermove', e => {

    });

    async function castStart() {
      if (!streamUrl) { toast('لا يوجد رابط بث'); return; }

      try { await loadCastSdk(); } catch (e) { toast('البث غير مدعوم في هذا المتصفح'); return; }
      try {
        const ctx = cast.framework.CastContext.getInstance();
        ctx.setOptions({ receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID, autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
        await ctx.requestSession();
        const session = ctx.getCurrentSession();
        const info = new chrome.cast.media.MediaInfo(streamUrl, 'application/x-mpegURL');
        info.streamType = chrome.cast.media.StreamType.BUFFERED;
        const md = new chrome.cast.media.GenericMediaMetadata();

    // ----- Playback -----

    function attachSource(url, token) {
      const nativeHls = video.canPlayType('application/vnd.apple.mpegurl');
      if (nativeHls && canAirPlay()) {
        video.src = url;
        video.play().catch(() => {});
      } else if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, backBufferLength: 30, enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { buildQualities(); video.play().catch(() => {}); });
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (!d.fatal || token !== plToken) return;
          if (d.type === Hls.ErrorTypes.NETWORK_ERROR && netRetries++ < 3) hls.startLoad();
          else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && netRetries++ < 3) hls.recoverMediaError();
          else { setLoading(false); toast(ICON.warn, true); }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      } else {
        setLoading(false); toast('المتصفح لا يدعم التشغيل');
      }
    }

    async function playMovie(realid, title, series = null, item = null) {

    // ===== Remote Navigation =====
    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('show')) {
        const ae = document.activeElement;
        const onCtl = !!(ae && modal.contains(ae) && ae.tagName === 'BUTTON');
        showUI();
        if (e.key === 'Escape' || e.key === 'Backspace') {
          e.preventDefault();
          if (panelOpen) closePanel();
          else if (isFs()) toggleFs();
          else if (onCtl) ae.blur();
          else closePlayer();
          return;
        }
        if (!panelOpen && !onCtl) {
          e.preventDefault();
          if (e.key === 'ArrowRight') skip(10);
          else if (e.key === 'ArrowLeft') skip(-10);
          else if (e.key === 'ArrowUp') setVolume((video.muted ? 0 : video.volume) + 0.1);
          else if (e.key === 'ArrowDown') setVolume((video.muted ? 0 : video.volume) - 0.1);
          else if (e.key === ' ') togglePlay();
          else if (e.key === 'Enter') { togglePlay(); $('plPlay').focus(); }
          else if (e.key === 'f' || e.key === 'F') toggleFs();
          else if (e.key === 'm' || e.key === 'M') $('plMute').click();
          return;
        }
        if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      }

      if (seriesModal.classList.contains('show')) {
        if (e.key === 'Escape' || e.key === 'Backspace') { closeSeriesModal(); e.preventDefault(); return; }
      }

      const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
      if (!keys.includes(e.key)) return;
      if (document.activeElement.tagName === "INPUT") return;

      const scope = modal.classList.contains('show') ? (panelOpen ? (activePanel || $('plPanel')) : modal) : (seriesModal.classList.contains('show') ? seriesModal : document);
      const focusable = Array.from(scope.querySelectorAll('button, [tabindex="0"]'))
        .filter(el => el.offsetWidth > 0 && el.offsetHeight > 0 && !el.disabled && getComputedStyle(el).visibility !== 'hidden');
      if (focusable.length === 0) return;

      const current = document.activeElement;
      if (!current || !focusable.includes(current)) { focusable[0].focus(); e.preventDefault(); return; }

      e.preventDefault();
      const curRect = current.getBoundingClientRect();
      let best = null, minDist = Infinity;

      focusable.forEach(el => {
        if (el === current) return;
        const rect = el.getBoundingClientRect();
        const dx = (rect.left + rect.width/2) - (curRect.left + curRect.width/2);
        const dy = (rect.top + rect.height/2) - (curRect.top + curRect.height/2);
        let inDir = false, dist = Infinity;

        if (e.key === "ArrowRight" && dx > 10) { inDir = true; dist = Math.abs(dx) + Math.abs(dy)*2; }
        if (e.key === "ArrowLeft"  && dx < -10){ inDir = true; dist = Math.abs(dx) + Math.abs(dy)*2; }
        if (e.key === "ArrowDown"  && dy > 10) { inDir = true; dist = Math.abs(dy) + Math.abs(dx)*2; }
        if (e.key === "ArrowUp"    && dy < -10){ inDir = true; dist = Math.abs(dy) + Math.abs(dx)*2; }

        if (inDir && dist < minDist) { minDist = dist; best = el; }
      });

      if (best) { best.focus(); best.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    });

    // ===== PWA =====
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

    let deferredInstall = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; installBtn.style.display = 'flex'; });
    installBtn.onclick = async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      try { await deferredInstall.userChoice; } catch (e) {}
      deferredInstall = null;
      installBtn.style.display = 'none';
    };
    window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    function dismissIosHint() { document.getElementById('iosHint').classList.remove('show'); try { localStorage.setItem('alm_ios_hint', '1'); } catch (e) {} }
    try {
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !standalone && !localStorage.getItem('alm_ios_hint')) {
        setTimeout(() => document.getElementById('iosHint').classList.add('show'), 4000);
      }
    } catch (e) {}

    let mouseTimer, curHidden = false;
    document.addEventListener('mousemove', () => {
      if (curHidden) { document.body.style.cursor = 'default'; curHidden = false; }
      clearTimeout(mouseTimer);
      mouseTimer = setTimeout(() => { document.body.style.cursor = 'none'; curHidden = true; }, 3000);
    }, { passive: true });
  </script>
</body>
</html>

  function playEp(ep, s) { playMovie(ep.realid, ep.title, s, s); }
  function playMovie(realid, title, series, item) {
    var tok = ++P.tok;
    openLayer('pl');
    P.series = series; P.item = series || item; P.epId = realid; P.url = '';
    if (series) markSeen(realid);
    destroyHls();
    try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch (e) {}
    var t = $('plTitle'); clear(t); t.appendChild(document.createTextNode(title || ''));
    $('plEpsBtn').style.display = series ? 'block' : 'none';
    $('plPrev').style.display = series ? 'block' : 'none';
    $('plNext').style.display = series ? 'block' : 'none';
    $('plAir').style.display = (vid.webkitShowPlaybackTargetPicker ? 'block' : 'none');
    delCls($('plEps'), 'show');
    syncPl(); setLoading(true); showBar();
    if (series && !series.loaded && !series.busy) loadSeries(series, false);
    api(API + '?action=stream&realid=' + encodeURIComponent(realid), function (e, d) {
      if (tok !== P.tok) return;
      if (e || !d || !d.url) { setLoading(false); toast(e ? 'حدث خطأ أثناء جلب الفيديو' : 'تعذر استخراج رابط المشاهدة'); return; }
      P.url = d.url;
      attach(d.url, tok);
      clearTimeout(P.watch);
      P.watch = setTimeout(function () { if (tok === P.tok && hasCls($('pl'), 'loading') && vid.readyState < 3) toast('التحميل بطيء — جرّب زر المشغّل الخارجي ↗ (VLC)'); }, 25000);
    }, 3, true);
  }
  function playNeighbor(d) { var n = neighbor(d); if (n) playMovie(n.realid, n.title, P.series, P.series); else toast(d > 0 ? 'لا توجد حلقة تالية' : 'هذه أول حلقة'); }

  /* أحداث الفيديو */
  on(vid, 'playing', function () { setLoading(false); });
  on(vid, 'canplay', function () { setLoading(false); });
  on(vid, 'waiting', function () { if (!vid.paused) setLoading(true); });
  on(vid, 'error', function () { if (P.url) { setLoading(false); toast('تعذّر التشغيل — جرّب المشغّل الخارجي ↗'); } });
  on(vid, 'ended', function () { if (P.series && neighbor(1)) playNeighbor(1); });

  /* شريط الأدوات */
  function barFocused() { var a = document.activeElement; return !!(a && $('plBar').contains && $('plBar').contains(a) && a !== $('plBar')); }
  function showBar() {
    delCls($('plBar'), 'hide');
    clearTimeout(P.barT);
    P.barT = setTimeout(function () { if (!barFocused() && !vid.paused) addCls($('plBar'), 'hide'); }, 5000);
  }
  each(['mousemove', 'touchstart', 'click'], function (ev) { on($('pl'), ev, function () { if (hasCls($('pl'), 'show')) showBar(); }); });

  tap($('plClose'), function () { closeLayer('pl'); });
  tap($('plFav'), function () { if (P.item) toggleFav(P.item); });
  tap($('plPrev'), function () { playNeighbor(-1); });
  tap($('plNext'), function () { playNeighbor(1); });
  tap($('plEpsBtn'), function () { openEpsPanel(); });
  tap($('plAir'), function () { try { vid.webkitShowPlaybackTargetPicker(); } catch (e) { toast('AirPlay غير متاح'); } });
  tap($('plCopy'), function () {
    if (!P.url) { toast('انتظر تجهيز الفيديو أولاً'); return; }
    var ok = false;
    try {
      var ta = document.createElement('textarea'); ta.value = P.url; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { ta.setSelectionRange(0, 99999); } catch (e0) {}
      ok = document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) {}
    if (ok) toast('تم نسخ الرابط'); else { try { window.prompt('انسخ الرابط:', P.url); } catch (e2) {} }
  });
  tap($('plExt'), function () {
    if (!P.url) { toast('انتظر تجهيز الفيديو أولاً'); return; }
    var u = P.url;
    try {
      if (ANDROID) {
        var m = /^(https?):\/\/(.*)$/.exec(u);
        location.href = m ? 'intent://' + m[2] + '#Intent;scheme=' + m[1] + ';action=android.intent.action.VIEW;type=video/*;end' : u;
      } else if (IOS) location.href = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(u);
      else window.open(u, '_blank');
    } catch (e) { toast('تعذر فتح المشغّل'); }
  });
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement); }
  function toggleFs() {
    var p = $('pl');
    try {
      if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document); return; }
      var f = p.requestFullscreen || p.webkitRequestFullscreen || p.mozRequestFullScreen || p.msRequestFullscreen;
      if (f) f.call(p);
      else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
      else toast('ملء الشاشة غير متاح');
    } catch (e) { try { if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); } catch (e2) {} }
  }
  tap($('plFs'), toggleFs);

  function openEpsPanel() {
    if (!P.series) return;
    var box = $('plEps');
    clear(box);
    var tabs = el('div', ''), grid = el('div', ''), clr = el('div', 'clr');
    tabs.style.cssText = 'overflow-x:auto;white-space:nowrap;padding-bottom:8px';
    var close = el('div', 'btn', '✕ إغلاق'); close.tabIndex = 0; close.setAttribute('role', 'button'); close.style.marginBottom = '8px';
    close.onclick = function () { closeEpsPanel(); };
    box.appendChild(close); box.appendChild(tabs); box.appendChild(grid); box.appendChild(clr);
    curSeason = null;
    var g = groupSeasons(P.series), names = seasonNames(g);
    for (var i = 0; i < names.length; i++) { var any = false; each(g[names[i]], function (e) { if (e.realid === P.epId) any = true; }); if (any) curSeason = names[i]; }
    function draw() {
      buildEpisodes(P.series, tabs, grid, function (ep) { closeEpsPanel(true); playMovie(ep.realid, ep.title, P.series, P.series); }, draw);
      var cs = grid.childNodes;
      for (var j = 0; j < cs.length; j++) if (cs[j].getAttribute('data-id') === String(P.epId)) { addCls(cs[j], 'next'); }
    }
    draw();
    addCls(box, 'show');
    var cur = null, cs2 = grid.childNodes;
    for (var k = 0; k < cs2.length; k++) if (cs2[k].getAttribute('data-id') === String(P.epId)) cur = cs2[k];
    try { (cur || close).focus(); } catch (e) {}
    if (cur) box.scrollTop = Math.max(0, cur.offsetTop - 120);
  }
  function closeEpsPanel(quiet) {
    delCls($('plEps'), 'show');
    if (!quiet) { showBar(); try { $('plEpsBtn').focus(); } catch (e) {} }
  }

  /* ---------- ريموت / كيبورد / فأرة ---------- */
  var KC = { 37: 'Left', 38: 'Up', 39: 'Right', 40: 'Down', 13: 'Enter', 23: 'Enter', 66: 'Enter', 27: 'Back', 8: 'Back', 4: 'Back', 111: 'Back', 10009: 'Back', 461: 'Back', 32: 'Space',
    179: 'PlayPause', 85: 'PlayPause', 415: 'Play', 19: 'Pause', 413: 'Stop', 417: 'FF', 412: 'RW', 228: 'FF', 227: 'RW', 176: 'Next', 177: 'Prev', 427: 'Next', 428: 'Prev', 33: 'Prev', 34: 'Next',
    36: 'Home', 93: 'Menu', 82: 'Menu', 457: 'Menu', 70: 'F', 77: 'M', 78: 'Next', 80: 'Prev' };

  function topLayer() {
    if (hasCls($('pl'), 'show')) return 'pl';
    if (hasCls($('sm'), 'show')) return 'sm';
    return 'main';
  }
  function navItems(scope) {
    var all = scope.querySelectorAll('[tabindex="0"], input, button, a[href]'), out = [];
    for (var i = 0; i < all.length; i++) {
      var e = all[i];
      if (e.disabled || e.offsetWidth === 0 || e.offsetHeight === 0) continue;
      var r = e.getBoundingClientRect();
      out.push({ el: e, r: r });
    }
    return out;
  }
  function navMove(dir, e, from) {
    var t = topLayer(), scope = t === 'pl' ? (hasCls($('plEps'), 'show') ? $('plEps') : $('plBar')) : (t === 'sm' ? $('sm') : $('app'));
    var items = navItems(scope);
    if (!items.length) return;
    var curEl = from || document.activeElement, ci = -1, i;
    for (i = 0; i < items.length; i++) if (items[i].el === curEl) { ci = i; break; }
    pd(e);
    if (ci < 0) { try { items[0].el.focus(); } catch (x) {} return; }
    var c = items[ci].r, cx = c.left + c.width / 2, cy = c.top + c.height / 2, best = null, min = 1e12;
    for (i = 0; i < items.length; i++) {
      if (i === ci) continue;
      var r = items[i].r, dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy, d = 1e12;
      var sameRow = Math.abs(dy) < Math.min(c.height, r.height) * 0.6;
      if (dir === 'Right' && dx > 8 && sameRow) d = dx + Math.abs(dy) * 2;
      else if (dir === 'Left' && dx < -8 && sameRow) d = -dx + Math.abs(dy) * 2;
      else if (dir === 'Down' && dy > 8) d = dy + Math.abs(dx) * 2;
      else if (dir === 'Up' && dy < -8) d = -dy + Math.abs(dx) * 2;
      if (d < min) { min = d; best = items[i].el; }
    }
    if (best) { try { best.focus(); } catch (x2) {} if (t === 'pl') showBar(); }
    else if (dir === 'Up' && t === 'main' && (window.pageYOffset || 0) > 0) window.scrollTo(0, 0);
  }
  function seek(d) { try { var t = vid.currentTime + d; if (vid.duration && t > vid.duration) t = vid.duration; vid.currentTime = Math.max(0, t); } catch (e) {} }
  function togglePlay() { try { if (vid.paused) tryPlay(); else vid.pause(); } catch (e) {} }

  function playerKey(k, e) {
    var ae = document.activeElement, onBar = barFocused(), inEps = hasCls($('plEps'), 'show');
    showBar();
    if (k === 'Back') { pd(e); if (inEps) closeEpsPanel(); else if (isFs()) toggleFs(); else closeLayer('pl'); return true; }
    if (k === 'PlayPause') { togglePlay(); pd(e); return true; }
    if (k === 'Play') { tryPlay(); pd(e); return true; }
    if (k === 'Pause') { try { vid.pause(); } catch (x) {} pd(e); return true; }
    if (k === 'Stop') { closeLayer('pl'); pd(e); return true; }
    if (k === 'FF') { seek(30); pd(e); return true; }
    if (k === 'RW') { seek(-30); pd(e); return true; }
    if (k === 'Next' || k === 'Prev') { playNeighbor(k === 'Next' ? 1 : -1); pd(e); return true; }
    if (inEps) return false;
    if (k === 'F') { toggleFs(); pd(e); return true; }
    if (!onBar) {
      pd(e);
      if (k === 'Right') seek(10);
      else if (k === 'Left') seek(-10);
      else if (k === 'Up') { try { $('plClose').focus(); } catch (x2) {} }
      else if (k === 'Space' || k === 'Enter') togglePlay();
      return true;
    }
    if (k === 'Down') { pd(e); try { ae.blur(); } catch (x3) {} addCls($('plBar'), 'hide'); return true; }
    return false;
  }

  var okDown = 0, okLong = false;
  on(document, 'keydown', function (e) {
    e = e || window.event;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var k = KC[e.keyCode || e.which];
    if (!k) return;
    var ae = document.activeElement, typing = ae && ae.tagName === 'INPUT';
    if (typing) {
      if (k === 'Back' && (e.keyCode || e.which) === 8) return;       // Backspace داخل الحقل
      if (k === 'Down' || k === 'Up') { try { ae.blur(); } catch (x) {} navMove(k, e, ae); return; }
      if (k === 'Back') { try { ae.blur(); } catch (x2) {} return; }
      return;
    }
    var t = topLayer();
    if (t === 'pl') { if (playerKey(k, e)) return; }
    else if (t === 'sm' && k === 'Back') { pd(e); closeLayer('sm'); return; }

    if (k === 'Up' || k === 'Down' || k === 'Left' || k === 'Right') { navMove(k, e); return; }
    if (k === 'Home' && t === 'main') { window.scrollTo(0, 0); return; }
    if (k === 'Back' && t === 'main') {
      if (cur.fav || cur.q || cur.cat) { pd(e); var f = $('cats').firstChild; if (f) { f.onclick(); try { f.focus(); } catch (x3) {} } }
      return;
    }
    if (ae && hasCls(ae, 'card') && (k === 'Menu' || k === 'F')) { pd(e); if (ae._item) toggleFav(ae._item); return; }

    if ((k === 'Enter' || k === 'Space') && ae && ae.tagName !== 'BUTTON' && ae.tagName !== 'A' && ae.getAttribute && ae.getAttribute('tabindex') === '0') {
      pd(e);
      if (hasCls(ae, 'card') && ae._item) {
        // OK مطوّلة على البطاقة = مفضلة
        if (okDown) { if (!okLong && new Date().getTime() - okDown > 650) { okLong = true; toggleFav(ae._item); } }
        else { okDown = new Date().getTime(); okLong = false; }
      } else ae.click();
    }
  });
  on(document, 'keyup', function (e) {
    e = e || window.event;
    var k = KC[e.keyCode || e.which];
    if (k !== 'Enter' && k !== 'Space') return;
    var ae = document.activeElement;
    if (!ae || !hasCls(ae, 'card') || ae.tagName === 'BUTTON' || topLayer() !== 'main') { okDown = 0; return; }
    if (okLong) { okLong = false; okDown = 0; return; }
    if (okDown) { okDown = 0; ae.click(); }
  });

  /* ---------- ربط عناصر الواجهة ---------- */
  $('sf').onsubmit = function () { doSearch(); return false; };
  tap($('sb'), function (e) { doSearch(); });
  var qT = 0;
  on($('q'), 'input', function () { clearTimeout(qT); qT = setTimeout(function () { if (trim($('q').value) !== cur.q) doSearch(); }, 900); });
  tap($('moreBtn'), function () { loadMore(0); });
  var scT = 0;
  on(window, 'scroll', function () {
    if (scT || topLayer() !== 'main') return;
    scT = setTimeout(function () {
      scT = 0;
      var h = document.documentElement, y = window.pageYOffset || h.scrollTop || 0;
      if (y + (window.innerHeight || h.clientHeight) > (h.scrollHeight || document.body.scrollHeight) - 700) loadMore(0);
    }, 250);
  });

  // بدء التشغيل
  $('moreBtn').appendChild(document.createTextNode('')); $('moreBtn').removeChild($('moreBtn').lastChild);
  buildCats([]);
  api(API + '?action=categories', function (e, d) {
    if (e || !d) return;
    var arr = d instanceof Array ? d : (d.categories || d.terms || []);
    each(arr, function (c) {
      if (!c || !c.slug) return;
      var b = el('div', 'cat', c.name); b.tabIndex = 0; b.setAttribute('role', 'button');
      b.onclick = function () { selectCat(c.slug, b, false); };
      $('cats').appendChild(b);
    });
  }, 3);
  if (!$('smCount').firstChild) $('smCount').appendChild(document.createTextNode(''));
  resetList();
  loadMore(0);
  try { var first = $('cats').firstChild; if (first) first.focus(); } catch (e0) {}
})();
</script>
</body>
</html>

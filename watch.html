<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشاهدة - Alameeere Movies</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="watch-page">
    <div class="player-container">
        <div class="player-header">
            <button id="back-btn" class="back-btn" tabindex="0">🔙 رجوع</button>
            <h2 id="video-title">جاري التحميل...</h2>
        </div>
        
        <div class="video-wrapper" id="video-wrapper" tabindex="0">
            <video id="main-video" playsinline></video>
            <div id="player-loader" class="player-loader">جاري التحميل...</div>
            
            <!-- عناصر التحكم المخصصة -->
            <div class="controls" id="controls">
                <div class="progress-bar-container">
                    <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
                </div>
                <div class="controls-row">
                    <button id="play-pause-btn" tabindex="0">⏸️</button>
                    <span id="time-display">0:00 / 0:00</span>
                    <div class="spacer"></div>
                    <button id="mute-btn" tabindex="0">🔊</button>
                    <input type="range" id="volume-bar" min="0" max="1" step="0.1" value="1">
                    <select id="speed-select" tabindex="0">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                    <button id="fullscreen-btn" tabindex="0">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- استدعاء مكتبة HLS للمشغل -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="js/spatial-nav.js"></script>
    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
